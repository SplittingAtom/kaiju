{{- $fullname := include "kobe.fullname" . -}}
{{- $np := .Values.server.networkPolicy | default dict -}}
{{- if $np.restrictEgress }}
{{- /* "Any address on the port" would admit every LAN and cluster host on 443/6443 or 5432,
     which defeats the policy: the peers are required (KOBE-698 review). */ -}}
{{- if not ($np.kubernetesApi | default dict).peers }}
{{- fail "server.networkPolicy.restrictEgress needs server.networkPolicy.kubernetesApi.peers: the API server's address as the pod sees it (kubectl get endpoints kubernetes), e.g. [{ipBlock: {cidr: 10.0.0.1/32}}]" }}
{{- end }}
{{- if and (ne .Values.postgres.mode "cnpg") (not $np.databasePeers) }}
{{- fail "server.networkPolicy.restrictEgress with external Postgres needs server.networkPolicy.databasePeers: your database's address (ipBlock) or selectors" }}
{{- end }}
# Server egress (KOBE-698, review SEC-9; opt-in, server.networkPolicy.restrictEgress). The server
# holds the envelope KEK, the approval key and the session signing keys, so a bypass of one of its
# outbound checks must not reach the cluster or the LAN: DNS, Postgres, Kaiju's own services, the
# Kubernetes API, public addresses on allowedPorts (S3, the identity provider, OAuth, model
# discovery) and SMTP. LAN or in-cluster S3, SMTP, IdP, telemetry or SIEM destinations need rules
# in server.networkPolicy.extraEgress (docs/install.md). NetworkPolicies add up: auth.sso's policy
# only allows more.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-server-egress
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if eq .Values.postgres.mode "cnpg" }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $fullname }}-pg
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    - to:
        {{- toYaml $np.databasePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ int $np.databasePort }}
    {{- end }}
    # Kaiju's own services: Bifrost's admin API, the model gateway, the MCP proxy, the egress proxy
    # (site jobs), ClamAV and the embedding service. Each has its own ingress policy.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "kobe.appName" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["bifrost", "model-gateway", "mcp-proxy", "egress-proxy", "clamav", "embeddings"]
    # The Kubernetes API (team namespaces, sandboxes): after the Service's DNAT the API server's
    # own address and port (6443 on k3s).
    - to:
        {{- toYaml $np.kubernetesApi.peers | nindent 8 }}
      ports:
        {{- range $np.kubernetesApi.ports }}
        - protocol: TCP
          port: {{ int . }}
        {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml (include "kobe.egressPrivateRanges" . | fromJsonArray) | nindent 14 }}
      ports:
        {{- range $np.allowedPorts }}
        - protocol: TCP
          port: {{ int . }}
        {{- end }}
    # The SMTP relay on a public address (smtp.port); a relay on the LAN or in the cluster needs
    # an extraEgress rule.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml (include "kobe.egressPrivateRanges" . | fromJsonArray) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ int .Values.smtp.port }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- $wnp := .Values.web.networkPolicy | default dict -}}
{{- if $wnp.restrictEgress }}
---
# Web egress (KOBE-698; opt-in, web.networkPolicy.restrictEgress): the web app only calls the
# server (KAIJU_SERVER_URL, the in-cluster Service by default) and DNS. A web.serverUrl outside the
# release needs a rule in web.networkPolicy.extraEgress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-web-egress
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "server") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- with $wnp.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
