{{- $fullname := include "kobe.fullname" . -}}
{{- $b := include "kobe.bifrostValues" . | fromJson -}}
# Components holding secrets or data are reachable only from pods in the release namespace.
# Bifrost (KOBE-40) is narrower: only the model-gateway shim (inference, with a member's virtual key)
# and the server (its admin API, for the config sync). Sandboxes reach models only through the shim,
# never Bifrost itself (receiving side, so it holds wherever the CNI applies egress selectors loosely).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-bifrost
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "bifrost") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $b.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "model-gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "server") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  {{- if $b.networkPolicy.restrictEgress }}
  # Bifrost's own egress: DNS and model providers on public IPv4 addresses (allowedPorts). Local
  # model servers (Ollama, vLLM) on private addresses need a rule in bifrost.networkPolicy.extraEgress
  # and allow_private_network on their provider.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml (include "kobe.egressPrivateRanges" . | fromJsonArray) | nindent 14 }}
      ports:
        {{- range $b.networkPolicy.allowedPorts }}
        - protocol: TCP
          port: {{ int . }}
        {{- end }}
    {{- if (include "kobe.embeddingsValues" . | fromJson).enabled }}
    # The in-cluster embedding service (KOBE-659), provider kobe-local.
    - to:
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "embeddings") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- with $b.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
---
# Sandboxes (team namespaces) must not reach the user-facing web app, the server's user API or the
# scheduler: only the server's sandbox port 8081. The server's internal port 8082 admits only the
# MCP proxy's and the egress proxy's pods; everything else outside team namespaces gets the app ports (8080, 8081). The team namespace's own egress policy says the
# same; this is the receiving side, so it holds even where a CNI applies egress selectors loosely.
# Everything that is not a team namespace (ingress controller, other Kaiju pods, operators) is
# unaffected; traffic from the node itself (kubelet probes) is not subject to NetworkPolicy here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-not-from-sandboxes
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kobe
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["web", "server", "scheduler"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kobe.splittingatom.io/team-namespace
                operator: DoesNotExist
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - from:
        - namespaceSelector:
            matchLabels:
              kobe.splittingatom.io/team-namespace: "true"
      ports:
        - protocol: TCP
          port: 8081
    # The server's internal listener: the MCP proxy (policy re-check, KOBE-58) and the egress
    # proxy (git decisions, KOBE-763), each with its own key.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "mcp-proxy") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "kobe.serverInternalPort" . }}
{{- if .Values.clamav.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-clamav
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "clamav") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # Only the API server streams uploads to clamd (D26); nothing else, sandboxes included.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "server") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3310
---
# ClamAV's own egress (KOBE-699): freshclam downloads signatures from database.clamav.net (a CDN,
# addresses not fixed) at start and then periodically, so DNS and public addresses on 443 and 80
# only. A private signature mirror needs a rule in clamav.networkPolicy.extraEgress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-clamav-egress
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "clamav") | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml (include "kobe.egressPrivateRanges" . | fromJsonArray) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    {{- with (.Values.clamav.networkPolicy | default dict).extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if eq .Values.postgres.mode "cnpg" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-pg
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $fullname }}-pg
  policyTypes: ["Ingress"]
  ingress:
    # Only the components that hold database credentials (kobe.databaseEnv: server, scheduler,
    # egress proxy, model gateway) and the migrate Job (KOBE-699). ClamAV, embeddings, Bifrost, web
    # and the MCP proxy never need the database. Operators reach it with `kubectl port-forward`,
    # which NetworkPolicy does not see (docs/backup-restore.md).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kobe
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["server", "scheduler", "egress-proxy", "model-gateway", "migrate"]
      ports:
        - protocol: TCP
          port: 5432
    # The Postgres instances themselves (streaming replication, instance manager status).
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $fullname }}-pg
    # The CloudNativePG operator manages instances over the status and Postgres ports.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.postgres.cnpg.operatorNamespace }}
{{- end }}
