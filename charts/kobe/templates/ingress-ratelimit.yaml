{{- /* KOBE-811: rate-limit middlewares and the event-stream Ingress (see _ingress.tpl). */ -}}
{{- $rl := .Values.ingress.rateLimit -}}
{{- if and .Values.ingress.enabled $rl.enabled -}}
{{- $fullname := include "kobe.fullname" . -}}
{{- $tls := .Values.ingress.tls -}}
{{- if and (gt (int (default 0 $rl.ipStrategy.depth)) 0) (or $rl.ipStrategy.excludedIPs $rl.ipStrategy.excludeTrustedProxies) }}
{{- fail "ingress.rateLimit.ipStrategy: set depth or excludedIPs/excludeTrustedProxies, not both (Traefik ignores excludedIPs when depth is set)" }}
{{- end }}
{{- if and (eq $rl.ipStrategy.excludeTrustedProxies true) (empty (concat (default list $rl.ipStrategy.excludedIPs) (default list .Values.auth.trustedProxies))) }}
{{- fail "ingress.rateLimit.ipStrategy.excludeTrustedProxies is true but auth.trustedProxies and excludedIPs are empty: nothing to exclude (unset it to count the connection's address)" }}
{{- end }}
{{- include "kobe.ingress.validateExcluded" . }}
{{- if and (semverCompare "<1.32-0" .Capabilities.KubeVersion.Version) (not $rl.assumeTraefikV3) }}
{{- fail (printf "ingress.rateLimit needs Traefik v3 (the event-stream Ingress uses the PathRegexp path matcher, which Traefik v2 lacks); this cluster is Kubernetes %s and k3s before 1.32 ships Traefik v2. Upgrade k3s, or set ingress.rateLimit.assumeTraefikV3=true if you run Traefik v3 yourself." .Capabilities.KubeVersion.Version) }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ratelimit
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  {{- include "kobe.ingress.rateLimitSpec" (dict "root" . "limit" $rl) | nindent 2 }}
{{- if $rl.streams.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ratelimit-streams
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  {{- include "kobe.ingress.rateLimitSpec" (dict "root" . "limit" $rl.streams) | nindent 2 }}
{{- end }}
---
# Event streams (SSE) under /v1: their own Ingress, so they get the streams limit (or none) instead
# of the main one. The longer PathRegexp rule outranks the main Ingress's PathPrefix(/v1).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-streams
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
  annotations:
    {{- with include "kobe.ingress.annotations" (dict "root" . "middleware" (ternary (printf "%s-ratelimit-streams" $fullname) "" (eq $rl.streams.enabled true)) "extra" (dict "traefik.ingress.kubernetes.io/router.pathmatcher" "PathRegexp") "secondary" true) | trim }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ default (printf "%s-tls" $fullname) $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ include "kobe.ingress.streamPathRegexp" . | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullname }}-server
                port: { name: http }
{{- end }}
