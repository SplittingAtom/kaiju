{{- $e := include "kaiju.egressProxyValues" . | fromJson -}}
{{- if not $e.git.internalKeySecret -}}
{{- include "kaiju.requireOnlineToGenerate" (dict "root" . "what" "the egress proxy internal key" "value" "egressProxy.git.internalKeySecret") -}}
{{- $name := include "kaiju.egressInternalKeySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := ($existing).data | default dict -}}
# key: what the egress proxy presents to the server's internal listener for git decisions
# (KOBE-763: per-repository credentials for git smart-HTTP to connected organizations). Separate
# from the MCP proxy's key, so neither proxy can call the other's routes. Generated once and kept
# across upgrades; held by the server and the egress proxy only. Rotating it (delete the Secret,
# upgrade) needs both to restart; git requests in between get no credential.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kaiju.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ ternary (index $data "key" | default "" | b64dec) (randAlphaNum 48) (hasKey $data "key") | quote }}
{{- end }}
