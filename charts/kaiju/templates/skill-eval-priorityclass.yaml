{{- /*
Skill eval sandboxes (KOBE-325): their pods carry this PriorityClass, which the per-team quota
<generation>-skill-eval-quota counts (the server creates it in each team namespace). Below the
default priority and never preempting: under node pressure a member's own sandbox wins over an
eval, and an eval never evicts anything. The name is the server's `evalPriorityClass` of the same
naming generation (kaiju-skill-eval; kobe-skill-eval on an install that keeps kobe-team-, KOBE-751).
*/ -}}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "kaiju.sandboxGeneration" . }}-skill-eval
  labels:
    {{- include "kaiju.labels" . | nindent 4 }}
value: -100
preemptionPolicy: Never
globalDefault: false
description: "Kaiju skill eval sandboxes: low priority, never preempt (KOBE-325)."
