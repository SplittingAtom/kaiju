{{- if .Values.ingress.enabled -}}
{{- $fullname := include "kaiju.fullname" . -}}
{{- $tls := .Values.ingress.tls -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "kaiju.labels" . | nindent 4 }}
  {{- /* KOBE-811: with ingress.rateLimit.enabled, every route here passes the rate-limit middleware. */}}
  annotations:
    {{- with include "kaiju.ingress.annotations" (dict "root" . "middleware" (ternary (printf "%s-ratelimit" $fullname) "" (eq .Values.ingress.rateLimit.enabled true))) | trim }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ default (printf "%s-tls" $fullname) $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-server
                port: { name: http }
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-server
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port: { name: http }
{{- end }}
